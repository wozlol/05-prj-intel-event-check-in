<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intel Sustainability Summit Check-In</title>
    <meta name="description" content="Check in to the Intel Team Sustainability Summit, pick your team, and watch attendance fill up live." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intel Sustainability Summit" />
    <meta property="og:title" content="Intel Sustainability Summit Check-In" />
    <meta property="og:description" content="Check in to the Intel Team Sustainability Summit, pick your team, and watch attendance fill up live." />
    <meta property="og:url" content="https://wozlol.github.io/05-prj-intel-event-check-in/" />
    <meta property="og:image" content="https://wozlol.github.io/05-prj-intel-event-check-in/img/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Intel Team Sustainability Summit check-in page" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Intel Sustainability Summit Check-In" />
    <meta name="twitter:description" content="Check in to the Intel Team Sustainability Summit, pick your team, and watch attendance fill up live." />
    <meta name="twitter:image" content="https://wozlol.github.io/05-prj-intel-event-check-in/img/og-image.png" />
    <!-- Add Font Awesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Admin menu -->
    <button id="adminMenuToggle" class="admin-menu-toggle" aria-label="Admin menu" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>

    <div id="adminMenu" class="admin-menu" hidden>
      <button type="button" id="downloadCsvBtn" class="download-btn">
        <i class="fas fa-download"></i> Download CSV
      </button>
      <button type="button" id="clearListBtn" class="clear-btn">
        <i class="fas fa-trash"></i> Clear List
      </button>
    </div>

    <div id="passwordModalOverlay" class="password-modal-overlay" hidden>
      <div class="password-modal" role="dialog" aria-labelledby="passwordModalTitle" aria-modal="true">
        <h3 id="passwordModalTitle">Admin Access</h3>
        <p class="password-modal-text">Enter the admin password to manage the attendee list.</p>
        <label for="adminPassword" class="password-label">Password</label>
        <input type="password" id="adminPassword" placeholder="TEST JUST CLICK OK" autocomplete="off" />
        <div class="password-modal-actions">
          <button type="button" id="passwordCancelBtn" class="password-cancel-btn">Cancel</button>
          <button type="button" id="passwordOkBtn" class="password-ok-btn">OK</button>
        </div>
      </div>
    </div>

    <!-- Hero section with Intel branding -->
    <div class="hero">
      <div class="hero-content">
        <img src="img/intel-logo.svg" alt="Intel Logo" class="intel-logo" />
        <h1>Team Sustainability Summit</h1>
        <div class="hero-divider"></div>
        <p>
          <i class="fas fa-leaf"></i> Check-in system for sustainability event
          attendees
        </p>
      </div>
    </div>
    <!-- Attendance tracking -->
    <div class="attendance-tracker">
      <div class="attendance-header">
        <i class="fas fa-users"></i>
        Attendance: <span id="attendeeCount">0</span>/50
      </div>
      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>
    <div id="celebrationBanner" class="celebration-banner" hidden></div>
    <div class="container">
      <!-- Feedback message -->
      <p id="greeting"></p>

      <!-- Check-in form -->
      <form class="check-in" id="checkInForm">
        <label for="attendeeName" class="form-label">Attendee Check-In</label>
        <div class="form-group">
          <div class="input-wrapper">
            <input
              type="text"
              id="attendeeName"
              name="attendeeName"
              placeholder="Enter name..."
              required
            />
            <select id="teamSelect" name="team" required>
              <option value="" disabled selected>Select Team...</option>
              <option value="water">Team Water Wise</option>
              <option value="zero">Team Net Zero</option>
              <option value="power">Team Renewables</option>
            </select>
          </div>
          <button type="submit" id="checkInBtn">
            <i class="fas fa-user-check"></i> Check In
          </button>
        </div>
      </form>

      <!-- Team stats -->
      <div class="team-stats">
        <h3>Team Attendance</h3>
        <div class="teams-grid">
          <div class="team-card water">
            <span class="team-name">🌊 Team Water Wise</span>
            <span class="team-count" id="waterCount">0</span>
          </div>
          <div class="team-card zero">
            <span class="team-name">🌿 Team Net Zero</span>
            <span class="team-count" id="zeroCount">0</span>
          </div>
          <div class="team-card power">
            <span class="team-name">⚡ Team Renewables</span>
            <span class="team-count" id="powerCount">0</span>
          </div>
        </div>
      </div>

      <div class="attendee-list-section">
        <h3>Attendee List</h3>
        <ul id="attendeeList" class="attendee-list"></ul>
      </div>
    </div>

    <footer class="footer">
      &copy; 2025 Intel •
      <a
        href="https://www.intel.com/content/www/us/en/corporate-responsibility/2030-goals.html"
        class="footer-link"
        >Sustainability Goals</a
      >
    </footer>

    <script src="script.js"></script>
  </body>
</html>
